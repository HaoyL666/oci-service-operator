# Replace targetRevision, image.tag, and image.digest together. image.digest
# must be the OCI index digest for the matching multi-architecture controller
# image; it takes precedence over the informational tag.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: osok-psql
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/oracle
    chart: oci-service-operator-psql-chart
    targetRevision: 2.3.0-alpha
    helm:
      releaseName: osok-psql
      valuesObject:
        image:
          repository: ghcr.io/oracle/oci-service-operator-psql
          tag: v2.3.0-alpha
          digest: sha256:ac65476b1cd0f61aff44e382b38ec3db0afc60d60038019ff30f0c8da492ad4e
        credentials:
          existingSecret: ocicredentials
  destination:
    server: https://kubernetes.default.svc
    namespace: oci-service-operator-psql-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
