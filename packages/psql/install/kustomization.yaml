apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oci-service-operator-psql-system
namePrefix: oci-service-operator-psql-

resources:
- generated/crd
- generated/rbac
- ../../../config/manager/psql
- ../../../config/rbac/leader_election_role.yaml

patches:
- path: ../../../config/default/manager_config_patch.yaml
  target:
    kind: Deployment
