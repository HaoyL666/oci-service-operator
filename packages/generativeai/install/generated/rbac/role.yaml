---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - generativeai.oracle.com
  resources:
  - dedicatedaiclusters
  - endpoints
  - models
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - generativeai.oracle.com
  resources:
  - dedicatedaiclusters/finalizers
  - endpoints/finalizers
  - models/finalizers
  verbs:
  - update
- apiGroups:
  - generativeai.oracle.com
  resources:
  - dedicatedaiclusters/status
  - endpoints/status
  - models/status
  verbs:
  - get
  - patch
  - update
