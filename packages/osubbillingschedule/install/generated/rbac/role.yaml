---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - osubbillingschedule.oracle.com
  resources:
  - billingschedules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - osubbillingschedule.oracle.com
  resources:
  - billingschedules/finalizers
  verbs:
  - update
- apiGroups:
  - osubbillingschedule.oracle.com
  resources:
  - billingschedules/status
  verbs:
  - get
  - patch
  - update
