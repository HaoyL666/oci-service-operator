apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oci-service-operator-psql-manager-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oci-service-operator-psql-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "osok-psql.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oci-service-operator-psql-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: oci-service-operator-psql-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ include "osok-psql.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
