apiVersion: containerengine.oracle.com/v1beta1
kind: NodePool
metadata:
  name: osok-oke-node-pool-${OSOK_E2E_SUFFIX}
spec:
  compartmentId: ${OCI_COMPARTMENT_ID}
  clusterId: ${OCI_CLUSTER_ID}
  name: osok-oke-node-pool-${OSOK_E2E_SUFFIX}
  nodeShape: ${OCI_COMPUTE_SHAPE}
  kubernetesVersion: ${OCI_KUBERNETES_VERSION}
  nodeMetadata:
    areLegacyImdsEndpointsDisabled: "true"
  nodeSourceDetails:
    sourceType: IMAGE
    imageId: ${OCI_IMAGE_ID}
    bootVolumeSizeInGBs: 50
  nodeShapeConfig:
    ocpus: 1
    memoryInGBs: 16
  nodeConfigDetails:
    size: 1
    placementConfigs:
      - availabilityDomain: ${OCI_AVAILABILITY_DOMAIN}
        subnetId: ${OCI_SUBNET_ID}
  freeformTags:
    osok-e2e-phase: create
