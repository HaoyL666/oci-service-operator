schemaVersion: 1
resources:
  - service: accessgovernancecp
    resource: governanceinstance
    classification: synthetic
    reason: Live creation requires a service entitlement and an IDCS administrator token.
  - service: analytics
    resource: analyticsinstance
    classification: synthetic
    reason: Live creation allocates paid Oracle Analytics capacity and has a long managed-service lifecycle.
  - service: apmtraces
    resource: scheduledquery
    classification: synthetic
    reason: An independent live create reached the service but free APM domains reject background scheduled queries; a paid domain should not be provisioned for portable tests.
  - service: bds
    resource: bdsinstance
    classification: synthetic
    reason: Live creation allocates multiple paid Big Data Service compute nodes and block volumes.
  - service: database
    resource: autonomousdatabase
    classification: synthetic
    reason: A production-tier Autonomous Database provisions billable database compute and storage with long create/delete lifecycles.
    nextAction: Add a contract-faithful synthetic create, update, and delete replay for a non-free-tier serverless database.
  - service: email
    resource: dkim
    classification: deferred
    reason: Live create and update reached the expected NEEDS_ATTENTION steady state, but deletion remained DELETING beyond the bounded recording window.
    blocker: A complete sanitized lifecycle cassette cannot be published until OCI reaches terminal deletion within the recorder timeout.
    nextAction: Re-record with an operator-approved longer delete window after confirming the Email service's expected DKIM retention time.
  - service: email
    resource: suppression
    classification: synthetic
    reason: Suppressions are tenancy-level resources, and direct ListSuppressions and CreateSuppression calls independently confirmed that the recording principal lacks permission.
    nextAction: Add a contract-faithful synthetic create, read, and delete replay from the pinned Email SDK surface.
  - service: filestorage
    resource: outboundconnector
    classification: synthetic
    reason: A live outbound connector requires a reachable LDAP directory, bind credentials, and a mount-target network path that should not be embedded in a portable recorder.
    nextAction: Add a contract-faithful synthetic lifecycle covering LDAP configuration and credential redaction.
  - service: filestorage
    resource: replication
    classification: synthetic
    reason: Live replication provisions and continuously operates a destination file system across availability domains, adding storage cost and a long synchronization lifecycle.
    nextAction: Add a contract-faithful synthetic lifecycle for create, update, replication-state observation, and delete.
  - service: functions
    resource: function
    classification: deferred
    reason: Function lifecycle recording is safe only after a reusable invocation image is available.
    blocker: No stable public test image and registry contract is packaged for the recorder.
    nextAction: Publish a minimal reusable image fixture, then record Function lifecycle beneath the recorded Application.
  - service: generativeai
    resource: dedicatedaicluster
    classification: synthetic
    reason: Live creation consumes scarce paid accelerator capacity.
  - service: integration
    resource: integrationinstance
    classification: synthetic
    reason: Live creation allocates paid Oracle Integration capacity and provisions identity resources.
  - service: managedkafka
    resource: kafkacluster
    classification: synthetic
    reason: Live creation allocates paid Kafka broker compute, storage, and private-network resources.
  - service: mysql
    resource: dbsystem
    classification: synthetic
    reason: Live creation provisions billable database compute and block storage and has a long lifecycle.
  - service: networkfirewall
    resource: mappedsecret
    classification: synthetic
    reason: A live mapped secret requires a Vault key and secret; OCI key deletion is scheduled rather than immediate, so recording would leave a billable prerequisite after the test.
    nextAction: Replace the synthetic cassette if an operator-managed disposable Vault secret becomes available for recording.
  - service: networkfirewall
    resource: networkfirewall
    classification: synthetic
    reason: Live creation provisions a billable Network Firewall endpoint in a subnet and has a long infrastructure lifecycle.
    nextAction: Replace the synthetic cassette when an operator-approved disposable firewall environment is available.
  - service: objectstorage
    resource: bucket
    classification: recorded
    syntheticReason: Throttling recovery and disappearance-before-delete are failure paths that should not be induced against live OCI.
  - service: oce
    resource: oceinstance
    classification: synthetic
    reason: Live creation allocates paid Oracle Content Management capacity and provisions IDCS resources.
  - service: ocvp
    resource: sddc
    classification: synthetic
    reason: Live creation allocates multiple billable bare-metal ESXi hosts and requires a purpose-built VLAN topology.
  - service: oda
    resource: odainstance
    classification: synthetic
    reason: Live creation allocates paid Oracle Digital Assistant service capacity.
  - service: opa
    resource: opainstance
    classification: synthetic
    reason: Live creation allocates paid Process Automation capacity and provisions IDCS resources.
  - service: opensearch
    resource: opensearchcluster
    classification: synthetic
    reason: Live creation allocates several compute nodes, block storage, and VCN infrastructure.
  - service: osmanagementhub
    resource: managementstation
    classification: synthetic
    reason: A management station requires a dedicated managed compute instance, network configuration, proxy/mirror storage, and ongoing agent infrastructure.
    nextAction: Add a contract-faithful synthetic lifecycle for the management-station configuration and work-request states.
  - service: psql
    resource: dbsystem
    classification: synthetic
    reason: Live creation allocates paid PostgreSQL database compute, block storage, and private-network resources.
  - service: queue
    resource: queue
    classification: recorded
    syntheticReason: A terminal failed work request should be replayed deterministically rather than deliberately induced in live OCI.
  - service: redis
    resource: rediscluster
    classification: synthetic
    reason: Live creation allocates paid cache nodes and private-network capacity.
  - service: rover
    resource: rovercluster
    classification: synthetic
    reason: Live creation represents an order for physical appliance infrastructure.
  - service: securityattribute
    resource: securityattribute
    classification: synthetic
    reason: The generated CR now exposes the required namespace identity, but live namespace access remains unavailable because the recording principal receives service-level 404 responses.
    nextAction: Replace the contract-faithful synthetic lifecycle with a live recording if a service-entitled test tenancy becomes available.
  - service: securityattribute
    resource: securityattributenamespace
    classification: synthetic
    reason: Both a service-manager create and an independent official OCI CLI list return service-level 404 NotAuthorizedOrNotFound for the recording principal.
    nextAction: Add a contract-faithful synthetic lifecycle from the pinned Security Attribute SDK surface.
  - service: servicecatalog
    resource: servicecatalog
    classification: deferred
    reason: Direct service-manager and official OCI CLI creates both fail with MissingParameter even though the serialized request contains displayName.
    blocker: The live Service Catalog endpoint rejects a valid SDK request before creating a resource.
    nextAction: Retry recording after the Service Catalog API accepts its documented CreateServiceCatalog payload.
  - service: visualbuilder
    resource: vbinstance
    classification: synthetic
    reason: Live creation allocates paid Visual Builder managed application capacity.
  - service: vulnerabilityscanning
    resource: containerscantarget
    classification: synthetic
    reason: Both the service manager and an independent OCI CLI create return NotAuthorizedOrNotFound because the operator-access session cannot resolve the delegated tenancy's OCIR compartment inside Vulnerability Scanning.
    nextAction: Replace the synthetic cassette when recording credentials belong directly to the target tenancy.
  - service: waas
    resource: waaspolicy
    classification: deferred
    reason: Live creation reached ACTIVE and exposed the real work-request entity type, but deletion exceeded the 15-minute recording window before later completing successfully.
    blocker: The interrupted recording has no terminal delete interactions, so it cannot be published as a complete portable lifecycle cassette.
    nextAction: Re-record with a longer bounded delete timeout and capture the successful work request plus final absence confirmation.
