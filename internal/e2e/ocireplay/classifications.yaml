schemaVersion: 1
resources:
  - service: accessgovernancecp
    resource: governanceinstance
    classification: synthetic
    reason: Live creation requires a service entitlement and an IDCS administrator token.
  - service: database
    resource: autonomousdatabase
    classification: synthetic
    reason: A production-tier Autonomous Database provisions billable database compute and storage with long create/delete lifecycles.
    nextAction: Add a contract-faithful synthetic create, update, and delete replay for a non-free-tier serverless database.
  - service: email
    resource: dkim
    classification: deferred
    reason: Live create and update reached the expected NEEDS_ATTENTION steady state, but deletion remained DELETING beyond the bounded recording window.
    blocker: A complete sanitized lifecycle cassette cannot be published until OCI reaches terminal deletion within the recorder timeout.
    nextAction: Re-record with an operator-approved longer delete window after confirming the Email service's expected DKIM retention time.
  - service: email
    resource: suppression
    classification: synthetic
    reason: Suppressions are tenancy-level resources, and direct ListSuppressions and CreateSuppression calls independently confirmed that the recording principal lacks permission.
    nextAction: Add a contract-faithful synthetic create, read, and delete replay from the pinned Email SDK surface.
  - service: functions
    resource: function
    classification: deferred
    reason: Function lifecycle recording is safe only after a reusable invocation image is available.
    blocker: No stable public test image and registry contract is packaged for the recorder.
    nextAction: Publish a minimal reusable image fixture, then record Function lifecycle beneath the recorded Application.
  - service: generativeai
    resource: dedicatedaicluster
    classification: synthetic
    reason: Live creation consumes scarce paid accelerator capacity.
  - service: loadbalancer
    resource: backend
    classification: deferred
    reason: Direct OCI creation succeeds, but the service-manager lifecycle retries create after the child is accepted because the path-only backend identity is not retained for observation.
    blocker: The handwritten Backend runtime must preserve its synthesized child identity across create follow-up before a complete cassette can be published.
    nextAction: Correct path-child identity tracking, then re-record beneath a temporary load balancer and backend set.
  - service: loadbalancer
    resource: pathrouteset
    classification: deferred
    reason: The service-manager create path reaches OCI but the immediate follow-up currently surfaces generated runtime resource-not-found instead of bounded eventual-consistency requeue.
    blocker: PathRouteSet create follow-up must tolerate the documented child read delay.
    nextAction: Add bounded create readback handling and re-record beneath a temporary load balancer.
  - service: loadbalancer
    resource: routingpolicy
    classification: deferred
    reason: The first real service-manager create returned InvalidParameter and requires request-shape comparison with a successful official CLI request.
    blocker: A reviewed live-valid routing rule payload has not yet been established for the generated request path.
    nextAction: Compare the SDK payload with a direct CLI create, correct the test or handwritten mapping, and re-record.
  - service: loadbalancer
    resource: ruleset
    classification: deferred
    reason: Direct OCI creation succeeds, while the service-manager path returns auth-shaped 404 before completing the same child lifecycle.
    blocker: The path-identity request mapping differs from the successful official CLI operation.
    nextAction: Correct the handwritten RuleSet path mapping and re-record beneath a temporary load balancer.
  - service: mysql
    resource: dbsystem
    classification: synthetic
    reason: Live creation provisions billable database compute and block storage and has a long lifecycle.
  - service: networkloadbalancer
    resource: backendset
    classification: deferred
    reason: Direct OCI creation succeeds, but the path-only service-manager create currently performs an auth-shaped missing-child read instead of establishing a new backend set.
    blocker: Parent path identity and child existence tracking are conflated in status.ocid.
    nextAction: Separate pre-create parent request identity from post-create child tracking, then re-record.
  - service: networkloadbalancer
    resource: listener
    classification: deferred
    reason: Live create, update, and delete complete, but a subsequent reconcile still treats the service's auth-shaped post-delete Get as fatal before stable scoped-list absence confirmation.
    blocker: Delete re-entry must settle eventual list visibility without failing or releasing the finalizer prematurely.
    nextAction: Refine the existing handwritten delete guard and re-record under a temporary network load balancer.
  - service: objectstorage
    resource: bucket
    classification: recorded
    syntheticReason: Throttling recovery and disappearance-before-delete are failure paths that should not be induced against live OCI.
  - service: ocvp
    resource: sddc
    classification: synthetic
    reason: Live creation allocates multiple billable bare-metal ESXi hosts and requires a purpose-built VLAN topology.
  - service: opensearch
    resource: opensearchcluster
    classification: synthetic
    reason: Live creation allocates several compute nodes, block storage, and VCN infrastructure.
  - service: queue
    resource: queue
    classification: recorded
    syntheticReason: A terminal failed work request should be replayed deterministically rather than deliberately induced in live OCI.
  - service: rover
    resource: rovercluster
    classification: synthetic
    reason: Live creation represents an order for physical appliance infrastructure.
  - service: securityattribute
    resource: securityattribute
    classification: deferred
    reason: A child security attribute requires a namespace, while the current generated CR spec exposes no namespace OCID or annotation contract for the mandatory SDK path parameter.
    blocker: The controller cannot construct CreateSecurityAttributeRequest.SecurityAttributeNamespaceId from the published desired-state surface.
    nextAction: Add a reviewed parent-namespace identity contract through generator source of truth, regenerate, and then add synthetic coverage because live namespace access is unavailable to the recording principal.
  - service: securityattribute
    resource: securityattributenamespace
    classification: synthetic
    reason: Both a service-manager create and an independent official OCI CLI list return service-level 404 NotAuthorizedOrNotFound for the recording principal.
    nextAction: Add a contract-faithful synthetic lifecycle from the pinned Security Attribute SDK surface.
  - service: servicecatalog
    resource: servicecatalog
    classification: deferred
    reason: Direct service-manager and official OCI CLI creates both fail with MissingParameter even though the serialized request contains displayName.
    blocker: The live Service Catalog endpoint rejects a valid SDK request before creating a resource.
    nextAction: Retry recording after the Service Catalog API accepts its documented CreateServiceCatalog payload.
