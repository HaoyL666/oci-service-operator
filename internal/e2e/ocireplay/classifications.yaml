schemaVersion: 1
resources:
  - service: accessgovernancecp
    resource: governanceinstance
    classification: synthetic
    reason: Live creation requires a service entitlement and an IDCS administrator token.
  - service: aidataplatform
    resource: aidataplatform
    classification: synthetic
    reason: Live creation allocates paid managed AI Data Platform capacity and has a long infrastructure lifecycle.
  - service: aispeech
    resource: transcriptionjob
    classification: recorded
  - service: analytics
    resource: analyticsinstance
    classification: synthetic
    reason: Live creation allocates paid Oracle Analytics capacity and has a long managed-service lifecycle.
  - service: apiaccesscontrol
    resource: privilegedapicontrol
    classification: synthetic
    reason: Live creation changes privileged API access policy and requires tenancy-specific approver identities.
  - service: apiplatform
    resource: apiplatforminstance
    classification: synthetic
    reason: Live creation allocates paid managed API Platform capacity and has a long infrastructure lifecycle.
  - service: apmtraces
    resource: scheduledquery
    classification: synthetic
    reason: An independent live create reached the service but free APM domains reject background scheduled queries; a paid domain should not be provisioned for portable tests.
  - service: appmgmtcontrol
    resource: monitoredinstance
    classification: recorded
  - service: artifacts
    resource: containerimagesignature
    classification: synthetic
    reason: A live signature requires a container image, KMS key version, and valid cryptographic signature that cannot be published in a portable fixture.
  - service: autoscaling
    resource: autoscalingconfiguration
    classification: synthetic
    reason: A live configuration requires a disposable instance pool or other scalable resource and can change compute capacity.
  - service: batch
    resource: batchcontext
    classification: synthetic
    reason: A bounded live probe confirmed that context creation provisions compute infrastructure, remained nonterminal beyond 15 minutes, and could not be deleted while the create work request was in progress.
  - service: batch
    resource: batchjobpool
    classification: synthetic
    reason: A live job pool requires a Batch Context whose creation was confirmed to provision long-lived compute infrastructure.
  - service: batch
    resource: batchtaskenvironment
    classification: recorded
  - service: batch
    resource: batchtaskprofile
    classification: recorded
  - service: bds
    resource: bdsinstance
    classification: synthetic
    reason: Live creation allocates multiple paid Big Data Service compute nodes and block volumes.
  - service: blockchain
    resource: blockchainplatform
    classification: synthetic
    reason: Live creation requires an IDCS access token and allocates paid Blockchain Platform compute capacity.
  - service: capacitymanagement
    resource: occcapacityrequest
    classification: synthetic
    reason: A live request reserves constrained OCI capacity and changes tenancy allocation commitments; the fixture validates the service-manager contract without consuming capacity.
  - service: cloudbridge
    resource: agent
    classification: synthetic
    reason: A live agent registration requires an installed Cloud Bridge agent in an external environment.
  - service: cloudbridge
    resource: agentdependency
    classification: synthetic
    reason: A live agent dependency requires a customer-supplied supported binary in Object Storage and changes the software used by external discovery agents.
  - service: cloudbridge
    resource: asset
    classification: synthetic
    reason: A live asset is populated from an external Cloud Bridge inventory and cannot be created as independent disposable OCI state.
  - service: cloudbridge
    resource: assetsource
    classification: synthetic
    reason: A live asset source requires an installed external discovery agent, environment, and inventory hierarchy.
  - service: cloudbridge
    resource: discoveryschedule
    classification: synthetic
    reason: A discovery schedule operates against an external Cloud Bridge environment and asset source that a portable test cannot provision.
  - service: cloudbridge
    resource: inventory
    classification: synthetic
    reason: Bounded live creates returned InvalidParameter in the test compartment and NotAuthorizedOrNotFound at the tenancy root, so the portable fixture exercises the SDK contract without claiming a live lifecycle.
  - service: cloudguard
    resource: adhocquery
    classification: synthetic
    reason: A live ad hoc query executes across tenancy resources and can expose security inventory; the fixture validates the SDK contract without querying live assets.
  - service: cloudguard
    resource: datamaskrule
    classification: synthetic
    reason: A live data-mask rule changes tenancy Cloud Guard security policy for an IAM group.
  - service: cloudguard
    resource: datasource
    classification: synthetic
    reason: A disabled bounded live create returned service-level 404, and an independent root-tenancy list could not return a usable collection; an enabled source would also continuously evaluate Logging Query data.
  - service: cloudguard
    resource: detectorrecipe
    classification: synthetic
    reason: A live SDK create from the visible Oracle-managed activity recipe fails with a resource-not-found-or-not-authorized response, and the recording principal cannot read the tenancy Cloud Guard configuration.
  - service: cloudguard
    resource: detectorrecipedetectorrule
    classification: synthetic
    reason: A live detector rule mutates an existing Cloud Guard detector recipe and its security posture.
  - service: cloudguard
    resource: responderrecipe
    classification: synthetic
    reason: A live responder recipe changes automated Cloud Guard remediation policy.
  - service: cloudguard
    resource: securityrecipe
    classification: synthetic
    reason: A live security recipe changes Security Zones policy composition for the tenancy.
  - service: cloudguard
    resource: securityzone
    classification: synthetic
    reason: A live security zone applies restrictive tenancy controls to a compartment and is unsafe for portable recording.
  - service: cloudguard
    resource: target
    classification: synthetic
    reason: A live Cloud Guard target enrolls a compartment into monitoring and changes its security posture.
  - service: cloudguard
    resource: targetdetectorrecipe
    classification: synthetic
    reason: A live target detector recipe attaches detection policy to an enrolled Cloud Guard target.
  - service: cloudguard
    resource: targetresponderrecipe
    classification: synthetic
    reason: A live target responder recipe attaches automated remediation policy to an enrolled Cloud Guard target.
  - service: cloudguard
    resource: wlpagent
    classification: synthetic
    reason: A live WLP agent registration requires an external host agent and a real certificate signing request.
  - service: cloudmigrations
    resource: migration
    classification: synthetic
    reason: A live migration requires discovered VMware assets, replication infrastructure, and billable migration execution.
  - service: cloudmigrations
    resource: migrationasset
    classification: synthetic
    reason: A live migration asset requires discovered VMware inventory, replication infrastructure, and Object Storage snapshots.
  - service: cloudmigrations
    resource: migrationplan
