schemaVersion: 1
surface: repo-authored-semantics
service: generativeaiagent
slug: datasource
kind: DataSource
archetype: generated-service-manager
states:
  - provisioning
  - active
  - updating
  - terminating
repoAuthored:
  providerLifecycle:
    createPending:
      - CREATING
    updatePending:
      - UPDATING
    deletePending:
      - DELETING
  listLookup:
    filters:
      - compartmentId
      - knowledgeBaseId
      - displayName
    matchRule: exact compartmentId plus knowledgeBaseId plus displayName unique match in ACTIVE, INACTIVE, CREATING, or UPDATING; duplicate matches fail
  mutation:
    mutable:
      - dataSourceConfig
      - definedTags
      - description
      - displayName
      - freeformTags
      - metadata
    forceNew:
      - compartmentId
      - knowledgeBaseId
  hooks:
    create:
      - helper: tfresource.CreateResource
      - helper: tfresource.WaitForWorkRequestWithErrorHandling
        entityType: datasource
        action: CREATED
    update:
      - helper: tfresource.UpdateResource
      - helper: tfresource.WaitForWorkRequestWithErrorHandling
        entityType: datasource
        action: UPDATED
    delete:
      - helper: tfresource.DeleteResource
      - helper: tfresource.WaitForWorkRequestWithErrorHandling
        entityType: datasource
        action: DELETED
  followUp:
    create: GetWorkRequest -> GetDataSource
    update: GetWorkRequest -> GetDataSource
    delete: GetWorkRequest -> GetDataSource/ListDataSources confirm-delete
notes:
  - Reviewed lifecycle mapping treats CREATING as provisioning, UPDATING as updating, ACTIVE and INACTIVE as success, and DELETING as terminating; FAILED is terminal and DELETED is only a delete-confirmation target.
  - CreateDataSource returns a DataSource body plus opc-work-request-id, while UpdateDataSource and DeleteDataSource return work-request headers without a resource body. The runtime prefers the create response identifier and otherwise recovers the DataSource OCID from work-request resources before rereading GetDataSource.
  - Pre-create reuse only runs when spec.displayName is present and keeps exact compartmentId plus knowledgeBaseId plus displayName matching bounded to ACTIVE, INACTIVE, CREATING, or UPDATING summaries.
  - Only displayName, description, dataSourceConfig, metadata, freeformTags, and definedTags reconcile in place; compartmentId and knowledgeBaseId remain replacement-only.
  - Delete keeps the finalizer until the work request is terminal and GetDataSource or fallback ListDataSources confirms the resource is gone.
  - Shared manifest promotion for this row is intentionally deferred to the convergence story.
