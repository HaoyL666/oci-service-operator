"14" lengthAdjust="spacing" textLength="163.4268" x="786" y="1625.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="786" y="1639.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="786" y="1653.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="786" y="1667.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="786" y="1681.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="786" y="1695.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="786" y="1709.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="786" y="1723.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.5791" x="786" y="1737.7803">service: email</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.834" x="786" y="1751.7803">slug: emaildomain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="116.71" x="786" y="1765.7803">kind: EmailDomain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="786" y="1779.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="786" y="1793.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="786" y="1807.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="786" y="1821.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="786" y="1835.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="786" y="1849.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="256.8262" x="786" y="1863.7803">supported drift: defined_tags, description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="233.4541" x="786" y="1877.7803">domain_verification_id, freeform_tags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="786" y="1891.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1787" x="786" y="1905.7803">compartment_id, name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="786" y="1919.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4541" x="786" y="1933.7803">list lookup: oci_email_email_domains filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="257.5645" x="786" y="1947.7803">compartment_id, id, lifecycle_state, name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="786" y="1961.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="786" y="1975.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3711" x="786" y="1989.7803">The generated runtime binds through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2402" x="786" y="2003.7803">ListEmailDomains on compartmentId plus name</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.709" x="786" y="2017.7803">before create when no OCI identifier is already</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="59.1445" x="786" y="2031.7803">recorded.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.7988" x="786" y="2045.7803">Requeue continues while OCI reports CREATING,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4131" x="786" y="2059.7803">UPDATING, or DELETING, and ACTIVE is the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.7783" x="786" y="2073.7803">steady-state success target for create or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="46.71" x="786" y="2087.7803">update.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="227.2539" x="786" y="2101.7803">In-place updates include description,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.0127" x="786" y="2115.7803">domainVerificationId, freeformTags, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4746" x="786" y="2129.7803">definedTags; compartmentId and name still</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.3994" x="786" y="2143.7803">require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="191.4336" x="786" y="2157.7803">Delete retains the finalizer until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.7578" x="786" y="2171.7803">GetEmailDomain or list fallback confirms DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.4053" x="786" y="2185.7803">or not found, and no Kubernetes secret side</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="169.6475" x="786" y="2199.7803">effects are part of this path.</text><?plantuml-src fLZRRXit47tdLn3jIm9exJYsSv6H0edjfaRSfB2TF1amgDrPYJL5Rack5BVeltU6bzMkB3LgWo2snCjSpvmPsjrBtGWhvjpDH6MMKazvBPG3vhgTYIZlfzQqkZerobZ-OrtYlwftee9QjCh_RBJ_AER0Vm6r02zBiVdCjVmJ-C5HRrDOQvP9-hFwuENp_arjFBnxP4DTlwnUh9yojWARJaoEZW-VlLuxGUhJ_k7XqS7nSMy_Y2-DrM3vmGlcfLV0h-6F5dG9lE0m5rBjdzFFCuC_DPl92dXjZ9-Ohpr1Bj_vYt4kIc_imB3aODvQzmoUmwlw6MwZC8oXR8Jsc-_t3-mYfUTy9qF96Ywb7eRkzP4udBp2NHBP3BRAINKC1ztMexIygaLTihzPy8r_Q2U0yVJWMCyEVeg6MACKsC7oE-7W2agZIxc-zSEdwqyVhi4kP0c_2YscO7_Wml7Xqk3AfzCBHYddPe497SeUhTr3y5kek0LdLEkbqUEqj5z9CSMSkltulLWTANAQzznYcYLKeD3RhRVZzl0cw2f0aws2nOkVUZ4QSz1ulWNUmnxQcfnXgvDqR-Zec7UVdrZIwlnJDZn2buRX6A-4eqDEacDzs8VKyqjZxl6NGFCdKbTCAC-zHK3WQKmzV6qKfYBaWMETQAod1owK1L4zuAvqth6XNh84Ju_vU_1zVO1yr8dkH4d7vz8vPAnjOYvHHq-EUr9BvS6wyQqkpPomCaTPTx8QSVfFfL0-b0hkd1SUHhTQ8vaz3OvPQ9sOO3p86y90Qx6-qGJC73805i0s8qxHOGzzTvGn3I_3Ccym-yIvfrVdRsykFhxVDIAeBqHbirt_ByeRVDY0fmO3Y59ZhImm8OFy8Z0fUAqBuYXo4V8yWG-gX9wpiBpDjBZRjsxBGRIhbdQUjIoaM7CBeNYhru4GKv3kv1ISdL-Uxvu2WlWZiTbdn93Gw2IUgQKM2lkTnGZWgWkWcIX3MDubt1OyQKks1c26aiDr-n0naFO8qlW1cOcRYKF9kog8PgqC5JKMoME