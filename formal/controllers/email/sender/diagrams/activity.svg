th:0.5;" width="303.2197" x="834.0115" y="1537"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2197" x="844.0115" y="1557.7803">Return success for the ACTIVE success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="846.0564" y="1591"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="856.0564" y="1611.7803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="856.0564" y="1625.7803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="251.9229" x="859.6599" y="1659"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="231.9229" x="869.6599" y="1679.7803">Requeue on provisioning, terminating</text><path d="M693.6827,1715 L693.6827,2010 L673.6827,2014 L693.6827,2018 L693.6827,2313 A0,0 0 0 0 693.6827,2313 L1024.3712,2313 A0,0 0 0 0 1024.3712,2313 L1024.3712,1725 L1014.3712,1715 L693.6827,1715 A0,0 0 0 0 693.6827,1715" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1014.3712,1715 L1014.3712,1725 L1024.3712,1725 L1014.3712,1715" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="699.6827" y="1730.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="699.6827" y="1744.7803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="699.6827" y="1758.7803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="699.6827" y="1772.7803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="699.6827" y="1786.7803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="699.6827" y="1800.7803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="699.6827" y="1814.7803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="699.6827" y="1828.7803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="699.6827" y="1842.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="699.6827" y="1856.7803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="699.6827" y="1870.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="85.5791" x="699.6827" y="1884.7803">service: email</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="76.2686" x="699.6827" y="1898.7803">slug: sender</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="78.6064" x="699.6827" y="1912.7803">kind: Sender</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="699.6827" y="1926.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="699.6827" y="1940.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="699.6827" y="1954.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="210.9023" x="699.6827" y="1968.7803">requeue: provisioning, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="304.2607" x="699.6827" y="1982.7803">provider states: create CREATING; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="112.0479" x="699.6827" y="1996.7803">delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1982" x="699.6827" y="2010.7803">supported drift: defined_tags, email_ip_pool_id,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="86.3721" x="699.6827" y="2024.7803">freeform_tags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="699.6827" y="2038.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2061" x="699.6827" y="2052.7803">compartment_id, email_address</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="699.6827" y="2066.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.1025" x="699.6827" y="2080.7803">list lookup: oci_email_senders filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.916" x="699.6827" y="2094.7803">compartment_id, email_address, lifecycle_state</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="699.6827" y="2108.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="699.6827" y="2122.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.0674" x="699.6827" y="2136.7803">The generated runtime reuses an existing sender</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="309.6885" x="699.6827" y="2150.7803">by exact compartmentId plus emailAddress match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="86.3857" x="699.6827" y="2164.7803">before create.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="215.5234" x="699.6827" y="2178.7803">Ready state maps to OCI ACTIVE.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5781" x="699.6827" y="2192.7803">In-place updates are limited to freeformTags,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.0605" x="699.6827" y="2206.7803">definedTags, and emailIpPoolId; compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="244.3506" x="699.6827" y="2220.7803">and emailAddress require replacement.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1641" x="699.6827" y="2234.7803">Create and update use read-after-write follow-up</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9502" x="699.6827" y="2248.7803">through GetSender before the controller reports</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="79.3789" x="699.6827" y="2262.7803">steady state.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0332" x="699.6827" y="2276.7803">Delete retains the finalizer until GetSender</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.5576" x="699.6827" y="2290.7803">confirms DELETED or OCI no longer returns the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="46.6963" x="699.6827" y="2304.7803">sender.</text><ellipse cx="662.6827" cy="2014" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="662.6827" cy="2014" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="662.6827" x2="662.6827" y1="157" y2="177"/><polygon fill="#0F172A" points="658.6827,167,662.6827,177,666.6827,167,662.6827,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="826.8356" x2="826.8356" y1="341" y2="361"/><polygon fill="#0F172A" points="822.8356,351,826.8356,361,830.8356,351,826.8356,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="826.8356" x2="826.8356" y1="409" y2="429"/><polygon fill="#0F172A" points="822.8356,419,826.8356,429,830.8356,419,826.8356,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="521.2169" x2="498.5299" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.5299" x2="498.5299" y1="257" y2="279"/><polygon fill="#0F172A" points="494.5299,269,498.5299,279,502.5299,269,498.5299,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="804.1486" x2="826.8356" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="826.8356" x2="826.8356" y1="257" y2="279"/><polygon fill="#0F172A" points="82