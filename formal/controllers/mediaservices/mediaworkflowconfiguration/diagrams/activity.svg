ing" textLength="189.8477" x="701.7104" y="1814.7803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.5996" x="701.7104" y="1828.7803">service: mediaservices</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.2129" x="701.7104" y="1842.7803">slug: mediaworkflowconfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.4268" x="701.7104" y="1856.7803">kind: MediaWorkflowConfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="701.7104" y="1870.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="701.7104" y="1884.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="701.7104" y="1898.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="701.7104" y="1912.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="701.7104" y="1926.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="701.7104" y="1940.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="701.7104" y="1954.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="701.7104" y="1968.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="701.7104" y="1982.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.834" x="701.7104" y="1996.7803">freeformTags, parameters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="701.7104" y="2010.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="701.7104" y="2024.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="701.7104" y="2038.7803">create-only fields: locks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="701.7104" y="2052.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0537" x="701.7104" y="2066.7803">oci_media_services_media_workflow_configurations</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="701.7104" y="2080.7803">filters compartmentId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.5918" x="701.7104" y="2094.7803">compartmentId plus displayName unique match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4541" x="701.7104" y="2108.7803">empty displayName skips pre-create lookup;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="701.7104" y="2122.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="701.7104" y="2136.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="701.7104" y="2150.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8467" x="701.7104" y="2164.7803">MediaWorkflowConfiguration create and update are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2539" x="701.7104" y="2178.7803">synchronous reread flows. OCI returns the body</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="323.709" x="701.7104" y="2192.7803">immediately and the resource exposes only ACTIVE</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8262" x="701.7104" y="2206.7803">and DELETED, so the reviewed runtime does not</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.5918" x="701.7104" y="2220.7803">publish provisioning or updating lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="52.1377" x="701.7104" y="2234.7803">buckets.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="701.7104" y="2248.7803">The published runtime excludes isLockOverride</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3779" x="701.7104" y="2262.7803">from update and delete, so lock overrides stay</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="701.7104" y="2276.7803">out of scope for the controller-backed surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5645" x="701.7104" y="2290.7803">Delete confirmation treats either a DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.5645" x="701.7104" y="2304.7803">lifecycle reread or OCI NotFound as terminal; a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6748" x="701.7104" y="2318.7803">reread that still returns ACTIVE after delete is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.8604" x="701.7104" y="2332.7803">treated as delete pending and keeps the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="701.7104" y="2346.7803">finalizer until OCI stops returning the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="58.3584" x="701.7104" y="2360.7803">resource.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.668" x="701.7104" y="2374.7803">Matching create-time locks are normalized by</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8398" x="701.7104" y="2388.7803">ignoring OCI-populated timeCreated metadata so</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1436" x="701.7104" y="2402.7803">steady-state reconcile does not fail after a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="701.7104" y="2416.7803">successful create that requested locks, but</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="237.3164" x="701.7104" y="2430.7803">omitting spec.locks later still counts as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.1924" x="701.7104" y="2444.7803">create-only drift while OCI reports locks.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.7021" x="701.7104" y="2458.7803">Promotion to a seeded formal row is deferred to</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="218.6953" x="701.7104" y="2472.7803">the convergence story that updates</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.0127" x="701.7104" y="2486.7803">manifest-owned catalog metadata.</text><ellipse cx="664.7104" cy="2077" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="664.7104" cy="2077" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="664.7104" x2="664.7104" y1="157" y2="177"/><polygon fill="#0F172A" points="660.7104,167,664.7104,177,668.7104,167,664.7104,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="816.1763" x2="816.1763" y1="341" y2="361"/><polygon fill="#0F172A" points="812.1763,351,816.1763,361,820.1763,351,816.1763,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="816.1763" x2="816.1763" y1="423" y2="443"/><polygon fill="#0F172A" points="812.1763,433,816.1763,443,820.1763,433,816.1763,437" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="523.2446" x2="513.2446" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="513.2446" x2="513.2446" y1="257" y2="279"/><polygon fill="#0F172A" points="509.2446,269,513.2446,279,517.2446,269,513.2446,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="806.1763" x2="816.1763" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="816.1763" x2="816.1763" y1="257" y2="279"/><polygon fill="#0F172A" points="812.1763,269,816.1763,279,820.1763,269,816.1763,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="513.2446" x2="513.2446" y1="327" y2="509