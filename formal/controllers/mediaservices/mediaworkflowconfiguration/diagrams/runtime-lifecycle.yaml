schemaVersion: 1
surface: repo-authored-semantics
service: mediaservices
slug: mediaworkflowconfiguration
kind: MediaWorkflowConfiguration
archetype: generated-service-manager
states:
  - active
  - terminating
  - deleted
repoAuthored:
  listLookup:
    filters:
      - compartmentId
      - displayName
    matchRule: exact compartmentId plus displayName unique match; empty displayName skips pre-create lookup; duplicate matches fail
  mutation:
    mutable:
      - definedTags
      - displayName
      - freeformTags
      - parameters
    forceNew:
      - compartmentId
    createOnly:
      - locks
  hooks:
    create:
      - helper: tfresource.CreateResource
    update:
      - helper: tfresource.UpdateResource
    delete:
      - helper: tfresource.DeleteResource
  followUp:
    create: read-after-write
    update: read-after-write
    delete: confirm-delete
notes:
  - MediaWorkflowConfiguration create and update are synchronous reread flows. OCI returns the body immediately and the resource exposes only ACTIVE and DELETED, so the reviewed runtime does not publish provisioning or updating lifecycle buckets.
  - The published runtime excludes isLockOverride from update and delete, so lock overrides stay out of scope for the controller-backed surface.
  - Delete confirmation treats either a DELETED lifecycle reread or OCI NotFound as terminal; a reread that still returns ACTIVE after delete is treated as delete pending and keeps the finalizer until OCI stops returning the resource.
  - Matching create-time locks are normalized by ignoring OCI-populated timeCreated metadata so steady-state reconcile does not fail after a successful create that requested locks, but omitting spec.locks later still counts as create-only drift while OCI reports locks.
  - Promotion to a seeded formal row is deferred to the convergence story that updates manifest-owned catalog metadata.
