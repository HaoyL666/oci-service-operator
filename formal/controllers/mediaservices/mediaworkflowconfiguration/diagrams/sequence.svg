roke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="740.7241" x2="1008.4751" y1="1204" y2="1204"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="35.0205" x="747.7241" y="1142.7803">Apply</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.1094" x="747.7241" y="1156.7803">UpdateMediaWorkflowConfiguration</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="221.0127" x="747.7241" y="1170.7803">only for mutable fields definedTags,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.8408" x="747.7241" y="1184.7803">displayName, freeformTags,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.8066" x="747.7241" y="1198.7803">parameters</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg15"><polygon fill="#0F172A" points="1002.4751,1277,1012.4751,1281,1002.4751,1285,1006.4751,1281" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="740.7241" x2="1008.4751" y1="1281" y2="1281"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2891" x="747.7241" y="1233.7803">run helper hooks</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="747.7241" y="1247.7803">create=tfresource.CreateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="747.7241" y="1261.7803">update=tfresource.UpdateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.8438" x="747.7241" y="1275.7803">delete=tfresource.DeleteResource</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg16"><polygon fill="#0F172A" points="1002.4751,1347,1012.4751,1351,1002.4751,1355,1006.4751,1351" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="740.7241" x2="1008.4751" y1="1351" y2="1351"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0752" x="747.7241" y="1303.7803">apply follow-up strategy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="747.7241" y="1317.7803">create=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.8027" x="747.7241" y="1331.7803">update=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="747.7241" y="1345.7803">delete=confirm-delete</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg17"><polygon fill="#0F172A" points="484.146,1396,474.146,1400,484.146,1404,480.146,1400" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="478.146" x2="739.7241" y1="1400" y2="1400"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.7822" x="490.146" y="1380.7803">status=required,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="490.146" y="1394.7803">finalizer=retain-until-confirmed-delete</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg18"><polygon fill="#0F172A" points="316.1606,1431,306.1606,1435,316.1606,1439,312.1606,1435" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="310.1606" x2="472.146" y1="1435" y2="1435"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.9854" x="322.1606" y="1429.7803">requeue on terminating</text></g><path d="M745,1456 L745,2318 A8,8 0 0 0 753,2326 L1084,2326 A8,8 0 0 0 1092,2318 L1092,1458 L1082,1448 L753,1448 A8,8 0 0 0 745,1456" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1082,1448 L1082,1454 A4,4 0 0 0 1086,1458 L1092,1458 L1082,1448" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="751" y="1463.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="751" y="1477.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="751" y="1491.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="751" y="1505.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="751" y="1519.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="751" y="1533.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="751" y="1547.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="751" y="1561.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="751" y="1575.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="751" y="1589.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="751" y="1603.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="751" y="1617.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="751" y="1631.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="751" y="1645.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="141.5996" x="751" y="1659.7803">service: mediaservices</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="206.2129" x="751" y="1673.7803">slug: mediaworkflowconfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.4268" x="751" y="1687.7803">kind: MediaWorkflowConfiguration</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="751" y="1701.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="751" y="1715.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="751" y="1729.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="751" y="1743.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="751" y="1757.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="751" y="1771.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="751" y="1785.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="751" y="1799.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="751" y="1813.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="161.834" x="751" y="1827.7803">freeformTags, parameters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="751" y="1841.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="751" y="1855.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.5029" x="751" y="1869.7803">create-only fields: locks</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="751" y="1883.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="326.0537" x="751" y="1897.7803">oci_media_services_media_workflow_configurations</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.6543" x="751" y="1911.7803">filters compartmentId, displayName; exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="299.5918" x="751" y="1925.7803">compartmentId plus displayName unique match;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4541" x="751" y="1939.7803">empty displayName skips pre-create lookup;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.627" x="751" y="1953.7803">duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="751" y="1967.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="751" y="1981.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8467" x="751" y="1995.7803">MediaWorkflowConfiguration create and update are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2539" x="751" y="2009.7803">synchronous reread flows. OCI returns the body</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="323.709" x="751" y="2023.7803">immediately and the resource exposes only ACTIVE</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8262" x="751" y="2037.7803">and DELETED, so the reviewed runtime does not</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="250.5918" x="751" y="2051.7803">publish provisioning or updating lifecycle</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="52.1377" x="751" y="2065.7803">buckets.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.9229" x="751" y="2079.7803">The published runtime excludes isLockOverride</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3779" x="751" y="2093.7803">from update and delete, so lock overrides stay</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="751" y="2107.7803">out of scope for the controller-backed surface.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5645" x="751" y="2121.7803">Delete confirmation treats either a DELETED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="292.5645" x="751" y="2135.7803">lifecycle reread or OCI NotFound as terminal; a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6748" x="751" y="2149.7803">reread that still returns ACTIVE after delete is</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.8604" x="751" y="2163.7803">treated as delete pending and keeps the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.4404" x="751" y="2177.7803">finalizer until OCI stops returning the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="58.3584" x="751" y="2191.7803">resource.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.668" x="751" y="2205.7803">Matching create-time locks are normalized by</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8398" x="751" y="2219.7803">ignoring OCI-populated timeCreated metadata so</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1436" x="751" y="2233.7803">steady-state reconcile does not fail after a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="264.585" x="751" y="2247.7803">successful create that requested locks, but</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="237.3164" x="751" y="2261.7803">omitting spec.locks later still counts as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.1924" x="751" y="2275.7803">create-only drift while OCI reports locks.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="295.7021" x="751" y="2289.7803">Promotion to a seeded formal row is deferred to</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="218.6953" x="751" y="2303.7803">the convergence story that updates</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="214.0127" x="751" y="2317.7803">manifest-owned catalog metadata.</text><?plantuml-src hLXjRnot4VxENq6aNn90Ux9YEt5ES854SbeZSbnORlj5WC7RdRrZnIEt9FVEroB_FSzmkNkx9zrPQ0f3i9OS3kVbcMU62lVQDighjGmhLRcjjajPAnD8X65deShxfNUjhQwSSLx-gIxnhnf9L5IhriIVdOs_gZN9lvBPKDIbUbpcLl-7vCMBqQRotcspzcVrnVVVZazQ5-cd1pRKzVVLTuTIpbVaiyJYnSldptuuaE3hy_xpvoykNhuSxIVrfVEMlBpuJaGT3SbR-dTBjYHPo3LLMWNo6rrIE7_7N_zq_husRBgjzRBrAcfdnKfN96ldui9z7kaFlQh_2YbL6PsVs9lzxhSE7QPlwLNz3DjGXj3gHjdu-Fcnm5EqZ68ow32wfXjjfn7zuOLwldY5NLRPJBRAHVMIBeQj1zbwLQkw5B-9v9lyfLqGmXmfY94T4b6CtXb3VhBy4uB-WKfdItsuzTNxs_U_t7OfUQUiMfB_IgeWfqkJ8--ltWf6WdGRv7cg--pW76h2KoKz1MTQJkqyBvqZzqlaD9nttyLUfEZJF0kRPQ-X8WDlZvxkjgSdoLO9iM8VB5dyUHIZkIGB-PRaSIZUMTyx9_OdMS_KyRaSVl_QinKXVYEc8dne6fwv79J3mQ3XoPqzKHO96lB6kNlyf-3UGjjAA1Dbz00CmWHeqEV685KfJn9rP566EwcC9rNjiAj3369g1ri6wRdy2yKJrnDORRXfqAo3NEiGm7l7jDxWokDgmzUrDf5ycD_PqgqPQMkeVbkToKg7ngWTC-8toKrFRL0BH8jzOyIq7cm02v1dy0NAvPWDLt0_qfUSUrp__oLsZvZs28WQn06NT0MpGPWdITHMXgXY6v8w3aY7UvaHHrM6o7LQFcPfjtl2s2FdIXRow_xIZLPtzgJNWEET_KBsankb8MLXD-1RQwiCsfk7KrWDARqBunXqJucWfwWGfsmZXujIgM3Txxeivpq66tv9TYwuAptrWiwilQ6g1dmVQar9IZzygT6RtXpE5cezG0MPgb1RKDYThRokewIDCksusg_JyWek62wnFV5EJJrZLhvjcyPvm42sJSKtXTRNggGvpmxeHTL7jGndObHMPxBsHBNpwxGbKvybhaRnWVv5PPGBtYMvRjdqEOeC5L5OsdR61p4fMT6LMU6isMM1kUJS1P5PgwzrEItriKszw5