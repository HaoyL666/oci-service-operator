</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg15"><polygon fill="#0F172A" points="924.3403,1207,934.3403,1211,924.3403,1215,928.3403,1211" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="686.2554" x2="930.3403" y1="1211" y2="1211"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.2891" x="693.2554" y="1163.7803">run helper hooks</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="219.0508" x="693.2554" y="1177.7803">create=tfresource.CreateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="226.085" x="693.2554" y="1191.7803">update=tfresource.UpdateResource;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="212.8438" x="693.2554" y="1205.7803">delete=tfresource.DeleteResource</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg16"><polygon fill="#0F172A" points="924.3403,1277,934.3403,1281,924.3403,1285,928.3403,1281" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="686.2554" x2="930.3403" y1="1281" y2="1281"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="147.0752" x="693.2554" y="1233.7803">apply follow-up strategy</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="145.8926" x="693.2554" y="1247.7803">create=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.8027" x="693.2554" y="1261.7803">update=read-after-write;</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="135.0234" x="693.2554" y="1275.7803">delete=confirm-delete</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg17"><polygon fill="#0F172A" points="429.6772,1326,419.6772,1330,429.6772,1334,425.6772,1330" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="423.6772" x2="685.2554" y1="1330" y2="1330"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="100.7822" x="435.6772" y="1310.7803">status=required,</text><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.7197" x="435.6772" y="1324.7803">finalizer=retain-until-confirmed-delete</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg18"><polygon fill="#0F172A" points="261.6919,1361,251.6919,1365,261.6919,1369,257.6919,1365" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;stroke-dasharray:2,2;" x1="255.6919" x2="417.6772" y1="1365" y2="1365"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.9854" x="267.6919" y="1359.7803">requeue on terminating</text></g><path d="M691,1386 L691,2192 A8,8 0 0 0 699,2200 L1029,2200 A8,8 0 0 0 1037,2192 L1037,1388 L1027,1378 L699,1378 A8,8 0 0 0 691,1386" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1027,1378 L1027,1384 A4,4 0 0 0 1031,1388 L1037,1388 L1027,1378" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="697" y="1393.7803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="697" y="1407.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="697" y="1421.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="697" y="1435.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="697" y="1449.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="697" y="1463.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="697" y="1477.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="697" y="1491.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="697" y="1505.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="697" y="1519.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="697" y="1533.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="697" y="1547.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="697" y="1561.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="697" y="1575.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.8965" x="697" y="1589.7803">service: jms</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.5996" x="697" y="1603.7803">slug: jmsplugin</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.041" x="697" y="1617.7803">kind: JmsPlugin</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="697" y="1631.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="697" y="1645.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="697" y="1659.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="697" y="1673.7803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="697" y="1687.7803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="697" y="1701.7803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="697" y="1715.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="697" y="1729.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.1367" x="697" y="1743.7803">supported drift: definedTags, fleetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.248" x="697" y="1757.7803">freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="697" y="1771.7803">reject before mutate: force-new fields agentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="167.3096" x="697" y="1785.7803">agentType, compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="697" y="1799.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.5371" x="697" y="1813.7803">list lookup: oci_jms_jms_plugins filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.04" x="697" y="1827.7803">compartmentId, agentId, id; exact compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1504" x="697" y="1841.7803">plus agentId unique match in ACTIVE or INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0674" x="697" y="1855.7803">paginated list rereads are exhausted before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2676" x="697" y="1869.7803">concluding absent; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="697" y="1883.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="697" y="1897.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7295" x="697" y="1911.7803">JmsPlugin create and update are synchronous</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="697" y="1925.7803">reread flows. OCI returns the resource body</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.6748" x="697" y="1939.7803">directly, and fleet-less registration settles in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4678" x="697" y="1953.7803">INACTIVE rather than a provisioning bucket.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1436" x="697" y="1967.7803">ACTIVE and INACTIVE are the only published</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.6475" x="697" y="1981.7803">steady success states. NEEDS_ATTENTION stays</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3711" x="697" y="1995.7803">outside the success set, and DELETED is only a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="162.6406" x="697" y="2009.7803">delete-confirmation target.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8057" x="697" y="2023.7803">Pre-create reuse scopes by exact compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.8467" x="697" y="2037.7803">plus agentId and exhausts paginated</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2607" x="697" y="2051.7803">ListJmsPlugins responses before concluding</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.2266" x="697" y="2065.7803">absent. Only ACTIVE and INACTIVE summaries are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="57.5928" x="697" y="2079.7803">reusable.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="196.8613" x="697" y="2093.7803">Mutable drift is limited to fleetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.709" x="697" y="2107.7803">freeformTags, and definedTags. agentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="697" y="2121.7803">agentType, and compartmentId remain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.8193" x="697" y="2135.7803">replacement-only. Fleet detachment stays out of</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7432" x="697" y="2149.7803">scope because the published spec cannot</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.2959" x="697" y="2163.7803">distinguish omission from clear.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="697" y="2177.7803">Delete keeps the finalizer until rereads return</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.1719" x="697" y="2191.7803">DELETED or NotFound.</text><?plantuml-src fLXTRnit5dtdho2wBotWaUCcQLCPAP3QJjUjwnInTvyC5DGCHsBD8MT9ZXIrw7_VSqdEQ4QMDiOMXc697_Vpt7ClxH-LQOKJ3VShKTcDCajU2-qbyyFEGfIFIsSxKrrORHt_HrtYfngTg6GjEXtUMnDkHIFvFwLUow1ASVZCdVf3yhDNeqtXdDrawI_gis-_7jyqDiWVdjXGrzzMt-oVigwIBfzOl7hzyiLtUoT8VTv_-VBLsUlNe_qelhJEICVFlc511ItvdVnF9qqfUS5_R_pfJut_LNTBPTXALPBNreQ5_JGIullpVpBEHHcicnYLdUktzhsINyitzGjiGnZYfrfXmk7xumFFaJ9oV92XLIrlb9c6xRjNukNY3NP9P3lPAXVLQtasR3r9oPjQr2NxYqNV-C_TGYAMGNesieDVm11djPPkilo3yFAZBAqfrVxM5n_kFlny9zrQbV8NOSHIkY-uy7owDBdouUAQKRgvNIEPKzadU_S0V2ShxgItkWlAcdbUEgsKM2Ad_ZHzBtP7YZxDCxzUzX8ggU7jqTjfUtfJcYh2aks2nOllHp6QSsbmlfDyG1uipQwmtJcwDNLppeVFNphIwSDNR7g4Bas3CTy9XpjUaLixoCUqynjh7_57mFI5CXKJEl3W00QSHThbfrOZ3J4773LYK4TRBhIJejfYL_dWsLGhsO7JS_wZ33jj4Ymq21u4ASyRvJruwfYG6sWOfFWlQwM3T7x-O4hR44OQIBgkJZWkfG-g-YewuMJdnGAUa-MKwywXZg4G6KAb0-Z7L5x0kI3tJ3yixly9n0751zBTmal8J41U8sQJ100tFeZ