h="84.8135" x="853.3289" y="1490.2803">success state</text><rect fill="#F8FAFC" height="48" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="279.1299" x="847.1946" y="1523.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.1299" x="857.1946" y="1544.2803">Project required status and finalizer policy</text><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="857.1946" y="1558.2803">retain-until-confirmed-delete</text><rect fill="#F8FAFC" height="34" rx="8" ry="8" style="stroke:#0F172A;stroke-width:0.5;" width="169.4336" x="902.0427" y="1591.5"/><text fill="#0F172A" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="149.4336" x="912.0427" y="1612.2803">Requeue on terminating</text><path d="M694.2518,1647.5 L694.2518,2033.5 L674.2518,2037.5 L694.2518,2041.5 L694.2518,2427.5 A0,0 0 0 0 694.2518,2427.5 L1040.4784,2427.5 A0,0 0 0 0 1040.4784,2427.5 L1040.4784,1657.5 L1030.4784,1647.5 L694.2518,1647.5 A0,0 0 0 0 694.2518,1647.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><path d="M1030.4784,1647.5 L1030.4784,1657.5 L1040.4784,1657.5 L1030.4784,1647.5" fill="#FFF7D6" style="stroke:#B45309;stroke-width:0.5;"/><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="101.165" x="700.2518" y="1663.2803">shared diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.7852" x="700.2518" y="1677.2803">shared/diagrams/shared-reconcile-activity.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3438" x="700.2518" y="1691.2803">Start from the shared reconcile activity and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="273.8955" x="700.2518" y="1705.2803">specialize provider-backed CRUD, wait, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="182.875" x="700.2518" y="1719.2803">status-projection details here.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="229.5371" x="700.2518" y="1733.2803">Controller-local activity diagrams add</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="238.8955" x="700.2518" y="1747.2803">list-lookup hints, secret policies, delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="200.0332" x="700.2518" y="1761.2803">handling, and open formal gaps.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="700.2518" y="1775.2803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="291.0469" x="700.2518" y="1789.2803">controllers specialize the shared reconcile path</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="189.8477" x="700.2518" y="1803.2803">with formal runtime ownership.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.8965" x="700.2518" y="1817.2803">service: jms</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="92.5996" x="700.2518" y="1831.2803">slug: jmsplugin</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="98.041" x="700.2518" y="1845.2803">kind: JmsPlugin</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="700.2518" y="1859.2803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="700.2518" y="1873.2803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="700.2518" y="1887.2803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="128.4131" x="700.2518" y="1901.2803">requeue: terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.0674" x="700.2518" y="1915.2803">provider states: create none; update none;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1787" x="700.2518" y="1929.2803">delete none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="700.2518" y="1943.2803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="700.2518" y="1957.2803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="224.1367" x="700.2518" y="1971.2803">supported drift: definedTags, fleetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.248" x="700.2518" y="1985.2803">freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.8193" x="700.2518" y="1999.2803">reject before mutate: force-new fields agentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="167.3096" x="700.2518" y="2013.2803">agentType, compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="700.2518" y="2027.2803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="236.5371" x="700.2518" y="2041.2803">list lookup: oci_jms_jms_plugins filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.04" x="700.2518" y="2055.2803">compartmentId, agentId, id; exact compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="322.1504" x="700.2518" y="2069.2803">plus agentId unique match in ACTIVE or INACTIVE;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0674" x="700.2518" y="2083.2803">paginated list rereads are exhausted before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2676" x="700.2518" y="2097.2803">concluding absent; duplicate matches fail</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="700.2518" y="2111.2803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="700.2518" y="2125.2803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7295" x="700.2518" y="2139.2803">JmsPlugin create and update are synchronous</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3438" x="700.2518" y="2153.2803">reread flows. OCI returns the resource body</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.6748" x="700.2518" y="2167.2803">directly, and fleet-less registration settles in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="275.4678" x="700.2518" y="2181.2803">INACTIVE rather than a provisioning bucket.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1436" x="700.2518" y="2195.2803">ACTIVE and INACTIVE are the only published</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.6475" x="700.2518" y="2209.2803">steady success states. NEEDS_ATTENTION stays</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="300.3711" x="700.2518" y="2223.2803">outside the success set, and DELETED is only a</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="162.6406" x="700.2518" y="2237.2803">delete-confirmation target.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="305.8057" x="700.2518" y="2251.2803">Pre-create reuse scopes by exact compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.8467" x="700.2518" y="2265.2803">plus agentId and exhausts paginated</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="276.2607" x="700.2518" y="2279.2803">ListJmsPlugins responses before concluding</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="325.2266" x="700.2518" y="2293.2803">absent. Only ACTIVE and INACTIVE summaries are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="57.5928" x="700.2518" y="2307.2803">reusable.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="196.8613" x="700.2518" y="2321.2803">Mutable drift is limited to fleetId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="253.709" x="700.2518" y="2335.2803">freeformTags, and definedTags. agentId,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="700.2518" y="2349.2803">agentType, and compartmentId remain</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="298.8193" x="700.2518" y="2363.2803">replacement-only. Fleet detachment stays out of</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7432" x="700.2518" y="2377.2803">scope because the published spec cannot</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="195.2959" x="700.2518" y="2391.2803">distinguish omission from clear.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="278.5918" x="700.2518" y="2405.2803">Delete keeps the finalizer until rereads return</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="150.1719" x="700.2518" y="2419.2803">DELETED or NotFound.</text><ellipse cx="663.2518" cy="2037.5" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="663.2518" cy="2037.5" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="663.2518" x2="663.2518" y1="157" y2="177"/><polygon fill="#0F172A" points="659.2518,167,663.2518,177,667.2518,167,663.2518,171" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="827.7823" x2="827.7823" y1="341" y2="361"/><polygon fill="#0F172A" points="823.7823,351,827.7823,361,831.7823,351,827.7823,355" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="827.7823" x2="827.7823" y1="409" y2="429"/><polygon fill="#0F172A" points="823.7823,419,827.7823,429,831.7823,419,827.7823,423" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;stroke-width:1;" x1="521.786" x2="498.7213" y1="257" y2="257"/><line style="stroke:#0F172A;stroke-width:1;" x1="498.7213" x2="498.7213" y1="257" y2="279"/><polygon fill="#0F172A" points="494.7213,269,498.7213,279,502.7213,269,498.7213,273" style="stroke:#0F172A;stroke-width:1;"/><line style="stroke:#0F172A;st