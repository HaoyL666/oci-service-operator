 font-size="14" lengthAdjust="spacing" textLength="280.9297" x="746" y="1779.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="746" y="1793.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="746" y="1807.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="746" y="1821.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="746" y="1835.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="746" y="1849.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="746" y="1863.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="746" y="1877.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="746" y="1891.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="746" y="1905.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="154.8271" x="746" y="1919.7803">service: disasterrecovery</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="72.3789" x="746" y="1933.7803">slug: drplan</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="76.2549" x="746" y="1947.7803">kind: DrPlan</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="746" y="1961.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="746" y="1975.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="746" y="1989.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="746" y="2003.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="746" y="2017.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="746" y="2031.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.1299" x="746" y="2045.7803">follow-up: create=GetWorkRequest -&gt; GetDrPlan;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.2334" x="746" y="2059.7803">update=GetWorkRequest -&gt; GetDrPlan;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="279.7402" x="746" y="2073.7803">delete=GetDrPlan/ListDrPlans confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="746" y="2087.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4063" x="746" y="2101.7803">freeformTags, planGroups</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="746" y="2115.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.8057" x="746" y="2129.7803">drProtectionGroupId, sourcePlanId, type</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="746" y="2143.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="267.6953" x="746" y="2157.7803">list lookup: oci_disaster_recovery_dr_plans</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2402" x="746" y="2171.7803">filters drProtectionGroupId, displayName, type,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.916" x="746" y="2185.7803">drPlanId; exact drProtectionGroupId plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.1572" x="746" y="2199.7803">displayName and type unique match; tracked</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="297.2949" x="746" y="2213.7803">rereads and delete confirmation can additionally</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="117.5029" x="746" y="2227.7803">narrow by drPlanId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="746" y="2241.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="746" y="2255.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="318.2881" x="746" y="2269.7803">DrPlan create and update are work-request-backed</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="296.4951" x="746" y="2283.7803">and resume through status.async.current as the</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="158.7373" x="746" y="2297.7803">canonical in-flight tracker.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.6816" x="746" y="2311.7803">List responses expose DrPlanSummary items only,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1436" x="746" y="2325.7803">so the runtime rereads GetDrPlan before status</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="283.2744" x="746" y="2339.7803">projection or mutable drift checks that depend</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.6748" x="746" y="2353.7803">on planGroups or sourcePlanId.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="258.3779" x="746" y="2367.7803">Create ignores spec.planGroups because</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="310.502" x="746" y="2381.7803">CreateDrPlanDetails does not accept planGroups;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="270.0674" x="746" y="2395.7803">in-place plan group edits are published only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.9922" x="746" y="2409.7803">through UpdateDrPlanDetails.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="245.9023" x="746" y="2423.7803">The resource-local update builder strips</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.3711" x="746" y="2437.7803">read-only group and step fields from GetDrPlan</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="290.2813" x="746" y="2451.7803">before diffing so service-owned metadata does</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="180.5781" x="746" y="2465.7803">not cause perpetual updates.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="255.2539" x="746" y="2479.7803">Refresh, verify, plan execution, and other</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="286.3438" x="746" y="2493.7803">disaster recovery helper families remain out of</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="248.999" x="746" y="2507.7803">scope for this controller-backed runtime.</text><?plantuml-src hLZRRXj74dtlhoXaNnA0fApOJXmAMY2Hj8uHRMn83lmYm6ZEr90TpNJFTlUGvYxstxUgBpD3YhIPRA07aNsfUvqwJVUeT2kjRC2jP6asIY-XahL3uVgTXImUbzPqkhmojR7mjwgWlt9qeiHAThN_Xz7-LzaW_8pr6hqgvE4pz-hV2ESlHflIMhD9qfzLvzz_ExwfZSUVdjXGLT-Nt-sVChP4cquiNhny_ko7lHEiFkq_V_xY_ENBqNuGNnYhqSBvTy8hNoFSuxywr0N254hbfFDeBHPcZNPxTctVrLABbIeHAcFymdmQYNFvvdy4W2oyiJlc9JVprhv_-2s-gfxHDWcZIAfMQd_u_lZ0AL968UXbrAh2MwLt0_Z32_byyOfsMMIxirKiofTutcyzISwhIbQ5-Ay8li4ltG8fgXwT6Da1LsI8DNMDTcVv9-dmZaAi2xM_zTNR-xU_tADTgmB_ARLSelqAf8FTfPqhRw_U24uySChsP4_sxb4BM2p1eZDrvvNHyxHqLYgvf9owi_XzEXoPvZJFt7gP9PHOaxT7RyVjtPkeor2WOWWMJFy-Yj4SKDFv3Y6M7TZiXnWEyPLT7-VGV_xQiaBdln6xH_ZIRYJcWt3onIdsAHLxI3ZS6lD8_oGPlL2w5BBsu2sL0HsaXEEdjgO4XEW3TOUcNjg2h2tASakxodadTbMo4NHw3g_H9rL8CDHBxQKe1uroZe3gc8HR4Xz5kAyhLLF7klc3BkqxI_4jE6clsOatvOHRkgtbba5hyg3zjaLQ2rVVbDy4honsJYue3kmAfxsprD9a12MBcfvg_fWPL-Ijn-HBRKmBHLY1bdBDE7jrT_FZ-pU_lZuX4gGbHEEmDNyui0UCFb0uBGME1CP-M5CEThAfD3WlVUU2E0vLB6j8LOPbgfNhi7pCghYR33joXaogb6soWhMIWpDKRWzwbF4OwNGoH_hwvlRcf4XpyOw5PTUA6gKcNsYxKbhMDC0iEKghBX