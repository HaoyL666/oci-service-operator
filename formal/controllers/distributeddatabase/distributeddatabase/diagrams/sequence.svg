ext><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="307.3916" x="770" y="1779.7803">shared/diagrams/shared-resolution-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="143.1992" x="770" y="1793.7803">shared delete diagram:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="284.833" x="770" y="1807.7803">shared/diagrams/shared-delete-sequence.svg</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="280.9297" x="770" y="1821.7803">Start from the shared resolution sequence for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="260.7295" x="770" y="1835.7803">OCID binding, datasource pagination, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4268" x="770" y="1849.7803">create-or-update dispatch.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="301.1982" x="770" y="1863.7803">Layer the shared delete sequence when finalizer</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="269.2471" x="770" y="1877.7803">retention, delete confirmation, work-request</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="199.2334" x="770" y="1891.7803">polling, or Secret cleanup apply.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.709" x="770" y="1905.7803">archetype batch: Generated service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.1504" x="770" y="1919.7803">controllers follow the shared resolution and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="259.9297" x="770" y="1933.7803">delete sequences with imported waits and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="134.6064" x="770" y="1947.7803">controller-local policy.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3232" x="770" y="1961.7803">service: distributeddatabase</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="155.6611" x="770" y="1975.7803">slug: distributeddatabase</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="160.3096" x="770" y="1989.7803">kind: DistributedDatabase</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="241.2402" x="770" y="2003.7803">archetype: generated-service-manager</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="156.4063" x="770" y="2017.7803">status/finalizer: required /</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="174.3027" x="770" y="2031.7803">retain-until-confirmed-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="272.3984" x="770" y="2045.7803">requeue: provisioning, updating, terminating</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="265.3369" x="770" y="2059.7803">provider states: create CREATING; update</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="192.165" x="770" y="2073.7803">UPDATING; delete DELETING</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="209.6992" x="770" y="2087.7803">follow-up: create=read-after-write;</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="288.7158" x="770" y="2101.7803">update=read-after-write; delete=confirm-delete</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.9229" x="770" y="2115.7803">supported drift: definedTags, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="83.248" x="770" y="2129.7803">freeformTags</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="230.3301" x="770" y="2143.7803">reject before mutate: force-new fields</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="93.3721" x="770" y="2157.7803">compartmentId</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="144.751" x="770" y="2171.7803">create-only fields: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="770" y="2185.7803">list lookup:</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="341.7012" x="770" y="2199.7803">oci_globally_distributed_database_sharded_databases</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="223.3027" x="770" y="2213.7803">filters compartmentId, displayName,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="293.7539" x="770" y="2227.7803">dbDeploymentType, metadata (+2 more); exact</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="266.0957" x="770" y="2241.7803">compartmentId plus displayName list filters</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="249.7988" x="770" y="2255.7803">preserve dbDeploymentType, metadata,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="263.833" x="770" y="2269.7803">privateEndpointId, and lifecycleState when</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="319.8262" x="770" y="2283.7803">already known, then narrow summary candidates in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="228.7783" x="770" y="2297.7803">memory to a unique exact prefix plus</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="163.4131" x="770" y="2311.7803">dbDeploymentType match</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="89.4961" x="770" y="2325.7803">conflicts: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="104.3164" x="770" y="2339.7803">open gaps: none</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="271.5986" x="770" y="2353.7803">Create-body normalization keeps shard and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.1367" x="770" y="2367.7803">catalog `source` inputs compatible with the OCI</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="336.8613" x="770" y="2381.7803">SDK: CRD `EXISTING_CLUSTER` values serialize as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="303.7891" x="770" y="2395.7803">the SDK's `EXADB_XS`, scaffold-only `jsonData`</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="252.1641" x="770" y="2409.7803">is dropped, and explicit false booleans in</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="312.8398" x="770" y="2423.7803">nested vm-cluster and backup-config payloads are</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="66.1445" x="770" y="2437.7803">preserved.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.5576" x="770" y="2451.7803">Reviewed lifecycle mapping treats CREATING as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="316.7021" x="770" y="2465.7803">provisioning, UPDATING as updating, ACTIVE and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="360.9854" x="770" y="2479.7803">INACTIVE as success, NEEDS_ATTENTION and FAILED</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="274.668" x="770" y="2493.7803">as terminal non-success, and DELETING as</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.1445" x="770" y="2507.7803">terminating.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="203.0957" x="770" y="2521.7803">ListDistributedDatabases returns</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="281.6611" x="770" y="2535.7803">DistributedDatabaseSummary items that omit</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="197.6543" x="770" y="2549.7803">fields such as scanListenerPort,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="234.1992" x="770" y="2563.7803">latestGsmImageDetails, shardDetails,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="306.6123" x="770" y="2577.7803">catalogDetails, gsmDetails, dbBackupConfig, and</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="289.4609" x="770" y="2591.7803">gsmSshPublicKey, so every successful bind or</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="308.9434" x="770" y="2605.7803">write path rereads GetDistributedDatabase before</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="185.9854" x="770" y="2619.7803">projecting steady-state status.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.1572" x="770" y="2633.7803">The provider resource exposes broader patch,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4746" x="770" y="2647.7803">state-transition, and trigger update families,</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="268.4883" x="770" y="2661.7803">but the current CRD does not publish those</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="246.6816" x="770" y="2675.7803">controls; the package-local runtime only</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="213.2334" x="770" y="2689.7803">performs in-place updates through</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="235.0127" x="770" y="2703.7803">UpdateDistributedDatabaseDetails for</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="287.9229" x="770" y="2717.7803">displayName, freeformTags, and definedTags.</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="186.7715" x="770" y="2731.7803">Delete keeps the finalizer until</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="294.8955" x="770" y="2745.7803">GetDistributedDatabase or list fallback confirms</text><text fill="#334155" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="175.7998" x="770" y="2759.7803">DELETED or NOT_FOUND.</text><?plantuml-src fLXTSzku5Nt7hy1i7vfCHJkVkrbbqXd7Kb9FN3jZEPrzq8mDaQ24DGcm02b5xVI_zrm0f4X7ShoRyOD50hYVvvvxGNUdT2MiABbRYSnib5xoN1HECjUjB4HwjxIcqTcfAOpbVybJ_6Mz7PdCHLFK7uokBqGf-JzaiPQrIiN-FJFr7ycVl-ej2clD9af_bZ__vKN_f3QrVF-D3Nd-I_Rp_Lt6PjB67OjNhry--_NU3b8Vrr--VFNyzUlUkXUV6gkbvSz_PhMg2ybdyj-DrAda2S-KgwrQDBNCCb6BXN3oUB9xDudls4fbakV6r0lpjIVUjPB-opWNQMtimDpeThjqtr_vGhx9ds4PmX1PLGbTxp_Vt_0OARsGT38AbSjpfOS1_VMLUBbuWrKIMGsMqaNsMZxlbhv9rfjSv2dx7_E-yK_DGYBAjNIiPmS_XI7M58MqWzVl4TChcHgTgljBFrtEBZ_Df5shLFvJQB6KzYSk71--6XovF3rZ10HkraZpKFRetZcKX9KPjzAPegcLqUFuwZXJOecSkkFmdEos96sQZznwsKh8P05l3vuEoyEJKcSUi6mNB9xylHUZCPSQ-nl9zs1mhcth5TiT8G53ZyUy-_t4adfNFsN3BNHe69SnxuJ3CwVWmbplAmGF1dvkp1t-2JYqK3fZegXvRG4H10PWa5-h0idncU6e78swst9HM2coBLOXrx6X0MGITe_vHrdlqol1NvsAJgHol5JEWU4EYJk7h3tot9DS5RMqRZpNgIa9JILadcKZeeIg45iYlT5SPuk9h0gpfTNhRIL7l9Ir8AxWJ_xsOgvBO-NJfpu0LZPEB110yfhGqrWm0qn4pi4TA9r3HfuYCBNSvtPXJCLJlymhu8Uu_FHgUd9zTl7nZqOG-dqKzzlvOzdPuziUO5O8E4w7wbiZaGDyACrTBUh6UN4KqL14FA9OPX5z4__wa8bXTP-L1mx0lbpPijMsLcAkz_i9RC_r8KI5N4KXRQucq_Ff7y_LmthQwAI551hXGC7bIei27TWYLdZhFEmMXQ5gUKnYB32Dy4VZAGlI5pVUssr0JLoZOi4Fi28t2mV9ZrKGpDePAdAKtxTI0qnRg18-WZNmnnj3m7sSma2acvNga5x2HmUOpNLRGYF-vVCa_kfIvJKNQjq6WaI141sCbqMMY0q87iHWLLvpkHP58xpX4Pl-zGh1AuYLTcrfQFE8UjQigIfZaLlUL1bfSetDHIh7D5YXKsVNOkb6h4z8FBTIviQMjCIkvEyohVc2taXUDcJk65I3Uawqt0I37HiG78lStV8V7zBVKDjXzcDWF-x9hnLOYZfTmMSqiQ-O2OPoMLKqha-j232881h1AuINiCGEAnonoger79pgh38gS3LXbEQQT8jYc97xRBEIkYEpEsqsUiHhUgVzG8eObwK0g5ESLHHrGWIqm9SjhmqNlD4As0bUG2bIyPK7y-yP5rpUjNLJrRtWeoo9MT08QsA2W1V0E0FWq_gnPTDFCA7O9xcj4rBeEX3H4j7wzpL5yZcfgcBBltZixMKXNMpd6gexqG5G0tYY4WxYqpDYn7RBY6t1_PdkTRY3saRpbIpGOFWAS7JewhvflglpjiCTXIvx5H_VpdMmhBybnAAt9V1JVqjeB-sMG_O87zeS8vhP92WEE0J1osrd5-4pyHoORAogU-RiMObMn4OLPyl7DjtGKzz55ikGi8w4tmNUJnequ2A9uhlXrIkuFpZUcrTRcaKxgAnPAmTe8ikZa7NwDTVmf8J6kkD3gvQhcfkSxv_DuoZzOuFvTwNi6z3181ObR4r9bC6_kIlixdk0E4EY9txyzGuJHyLHgX9Bxw_Hdg5OI7bYR19hWIg6gEE8dOijejfJrhRWLf6diovX30cZQOaaTwtJPosgsnXxbyHvYLL8ahVDKFk15RkPmUFpY